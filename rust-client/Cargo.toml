[package]
name = "benoit-bot"
version = "0.1.0"
edition = "2021"
description = "Benoit: High-Performance RL ScrabbleBot Client for SpacetimeDB"

[dependencies]
# SpacetimeDB SDK for real-time multiplayer table events and reducers
spacetimedb-sdk = "2.14.1"

# Pure-Rust ONNX execution engine (no external C++ libraries required)
tract-onnx = "0.21"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization and logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

